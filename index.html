<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Xu 徐蕴玮</title>
<link rel="stylesheet" href="assets/fonts/f-SHSerif.css"><link rel="stylesheet" href="assets/fonts/f-WenKai.css"><link rel="stylesheet" href="assets/fonts/f-ZQFS.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Serif&family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Crimson+Pro:wght@300;400&family=Spectral:wght@300;400&family=Libre+Caslon+Text:wght@400&family=Cardo:wght@400&family=Sorts+Mill+Goudy&family=Castoro&family=Bodoni+Moda:opsz,wght@6..96,400&family=Playfair+Display:wght@400&family=Libre+Baskerville:wght@400&family=Gilda+Display&family=Cormorant:wght@300;400&family=Inter:wght@300;400;500&family=Manrope:wght@300;400;500&family=Jost:wght@300;400;500&family=Inter+Tight:wght@300;400&family=Geist:wght@300;400&family=DM+Sans:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#F7F5FC;--surface:#FDFCFF;--tint:#F1ECFD;--line:#E5DDF6;
  --ink:#271F3F;--ink-2:#625A7B;--mute:#AFA8C5;--accent:#7C52DC;--accent-deep:#5B3AB0;
  /* Latin faces are swappable (preview panel); CJK: large = Source Han Serif (thin), small = LXGW Bright */
  --ed:'Newsreader';--es:'Gilda Display';--et:'Castoro';--el:'Gilda Display';--etw:300;
  /* Chinese: --zd = large type, --zs = small headings; body stays 思源黑体 (Noto Sans SC) as in the specimen */
  --zd:'SHSerif';--zs:'WenKai';--zb:'ZQFS';--zdw:300;
  --serif:var(--ed),var(--zd),'SHSerif',serif;
  --ks:var(--es),var(--zs),'Noto Sans SC',serif;
  --sans:var(--et),var(--zb),'Noto Sans SC',sans-serif;
  --latin:var(--el),var(--zb),'Noto Sans SC',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gut:clamp(20px,5vw,72px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-weight:var(--etw);line-height:1.75;margin:0;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
@media (hover:hover) and (pointer:fine){body.fx-cursor,body.fx-cursor a,body.fx-cursor button{cursor:none}}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:4px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gut)}

/* ---------- nav ---------- */
nav.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:40;transition:background .5s,box-shadow .5s}
nav.top.solid{background:rgba(247,245,252,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
nav.top .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:22px}
.logo{font-family:var(--latin);font-weight:500;font-size:12px;letter-spacing:.38em;color:var(--ink)}
.links{display:flex;gap:4px;align-items:center;font-size:14px;color:var(--ink-2)}
.links>a{padding:6px 12px}
.links>a.on{color:var(--accent)}
.lang{display:inline-flex;gap:2px;padding:3px;border-radius:99px;background:var(--surface);border:1px solid var(--line);margin-left:12px}
.lang button{font-family:var(--latin);font-size:11px;letter-spacing:.12em;padding:4px 11px;border-radius:99px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--tint);color:var(--accent)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:none}
.hero .wrap{position:relative;z-index:2;width:100%;padding-block:130px 90px}
.who{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.who .zh{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.2em;color:var(--accent-deep);display:inline-flex;overflow:hidden}
.who .zh span{display:inline-block;transition:transform 1s var(--ease),opacity 1s var(--ease)}
.who .en{font-family:var(--latin);font-size:11px;letter-spacing:.42em;color:var(--mute);text-transform:uppercase}
.statement{font-family:var(--serif);font-weight:500;font-size:clamp(40px,6.4vw,92px);line-height:1.28;letter-spacing:.02em;margin:34px 0 0;max-width:12.5em;color:var(--mute)}
.statement .k{color:var(--ink)}
.statement .w{display:inline-block;transition:opacity 1s var(--ease),filter 1s var(--ease),transform 1s var(--ease)}
.sub{margin:36px 0 0;max-width:34em;color:var(--ink-2);font-size:16px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px}
.pre .who .zh span{transform:translateY(105%);opacity:0}
.pre .statement .w{opacity:0;filter:blur(10px);transform:translateY(12px)}
.pre .fade{opacity:0;transform:translateY(10px)}
.fade{transition:opacity 1s var(--ease) 1.5s,transform 1s var(--ease) 1.5s}
.corner{position:absolute;right:var(--gut);bottom:34px;z-index:2;font-family:var(--latin);font-size:11px;letter-spacing:.24em;color:var(--mute);text-align:right;line-height:1.9}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:99px;font-size:14px;letter-spacing:.08em;transition:background .5s var(--ease),border-color .5s,box-shadow .5s}
.btn .rt{display:inline-block;height:1.5em;line-height:1.5em;overflow:hidden}
.btn .rt>span{display:flex;flex-direction:column;transition:transform .6s var(--ease)}
.btn:hover .rt>span{transform:translateY(-50%)}
.btn-solid{background:linear-gradient(135deg,#8B63E6,#6B46C9);color:#FDFCFF;box-shadow:0 12px 28px -14px rgba(124,82,220,.7)}
.btn-solid:hover{box-shadow:0 16px 34px -14px rgba(124,82,220,.85)}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn-ghost:hover{border-color:#CDBDF3}

/* ---------- section heads ---------- */
section.blk{padding-block:clamp(90px,12vw,160px) 0}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:44px}
.sh::before{content:"";width:28px;height:1px;background:var(--accent);order:-2}
html[lang=en] .sh small{display:none}
.sh small{font-family:var(--latin);font-size:10px;letter-spacing:.34em;color:var(--mute);text-transform:uppercase;order:1}
.sh h2{font-family:var(--sans);font-weight:400;font-size:15px;margin:0;letter-spacing:.16em;line-height:1.6;color:var(--ink-2);order:-1}
.sh h2 .m{color:var(--mute)}
.rise{overflow:hidden;padding-bottom:.06em}
.rise .ln{display:block;clip-path:inset(0 100% 0 0);transition:clip-path 1.3s cubic-bezier(.7,0,.2,1)}
.rise.in .ln{clip-path:inset(0 0 0 0)}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,96px);align-items:center}
.portrait{border-radius:30px;overflow:hidden;aspect-ratio:4/4.8;background:var(--tint)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block;will-change:filter,transform}
.about .txt p{font-size:clamp(17px,1.5vw,20px);line-height:2.05;color:var(--mute);margin:0 0 22px}
.about .txt p b{color:var(--ink);font-weight:400}
.more{display:inline-flex;align-items:center;gap:12px;margin-top:18px;font-size:14px;letter-spacing:.08em;color:var(--ink)}
.more i{font-style:normal;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .5s var(--ease),background .5s,color .5s,border-color .5s}
.more:hover i{transform:translateX(4px);background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- path ---------- */
.tl{position:relative;padding-left:44px;max-width:920px}
.tl::before,.tl .fill{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:1px;background:var(--line)}
.tl .fill{background:linear-gradient(var(--accent),#B9A2F2);transform-origin:top;transform:scaleY(var(--p,0))}
.ti{position:relative}
.ti::before{content:"";position:absolute;left:-43px;top:34px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:1px solid #C9B8F4;transition:background .5s,border-color .5s,box-shadow .5s}
.ti.on::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px rgba(124,82,220,.14)}
.ti{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,5fr);gap:24px;padding:28px 0;border-top:1px solid var(--line)}
.ti:last-child{border-bottom:1px solid var(--line)}
.ti .d{font-family:var(--latin);font-size:13px;letter-spacing:.06em;color:var(--mute);padding-top:6px}
.ti h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0}
.ti .r{font-size:14px;color:var(--ink-2);margin-top:4px}
.ti{cursor:pointer}.ti>div:last-child{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.ti .ar{flex:none;color:var(--accent);opacity:0;transform:translateX(-10px);transition:opacity .5s,transform .6s var(--ease);padding-top:8px}
.ti:hover .ar{opacity:1;transform:none}.ti h3{transition:color .5s}.ti:hover h3{color:var(--accent-deep)}
@media (hover:none){.ti .ar{opacity:1;transform:none}}
.entry{scroll-margin-top:110px;border-radius:14px;transition:background 1.2s}
.cvl{color:var(--ink)!important}.cvl i{font-style:normal;color:var(--accent)}
@media (max-width:900px){.links>a:not(.cvl){display:none!important}.links>a.cvl{display:inline-block}}
/* preview panel (prototype only) */
.rvp{box-sizing:border-box;position:fixed;right:16px;bottom:16px;z-index:110;background:rgba(253,252,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -24px rgba(91,58,176,.5);font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-2);max-width:calc(100vw - 32px)}
.rvp .sz{width:min(340px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;padding:0 16px 14px}
.rvp .sz h4{margin:14px 0 6px;font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--ink)}
.rvp .row{display:grid;grid-template-columns:26px minmax(0,1fr) 26px;grid-template-areas:'l l v' 'm s p';gap:2px 8px;align-items:center;padding:6px;margin:0 -6px;border-radius:8px}
.rvp .row>span{grid-area:l}.rvp .row>b{grid-area:v}.rvp .row>input{grid-area:s;min-width:0}.rvp .row>.st[data-d='-1']{grid-area:m}.rvp .row>.st[data-d='1']{grid-area:p}
.rvp .st{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent-deep);text-align:center;font-size:15px;line-height:1}
.rvp .st:hover{background:var(--tint)}
.rvp .row:hover{background:var(--tint)}
.rvp .row span{font-size:12px;color:var(--ink-2);line-height:1.35}
.rvp .row span i{display:block;font-style:normal;font-size:10.5px;color:var(--mute)}
.rvp input[type=range]{width:100%;accent-color:var(--accent)}
.rvp .row b{font:500 12px 'Inter',sans-serif;color:var(--accent-deep);text-align:right;margin:0;letter-spacing:0}
.rvp .ft{position:sticky;bottom:-14px;background:rgba(253,252,255,.97);padding:10px 0 4px;margin-top:10px;border-top:1px solid var(--line);display:flex;gap:14px;font-size:12px}
.rvp .ft button{color:var(--accent)}
.rvp textarea{width:100%;height:120px;margin-top:8px;font:11px/1.5 'Inter',monospace;color:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.fsbox{position:fixed;inset:0;z-index:115;background:rgba(39,31,63,.18);display:grid;place-items:center;padding:16px}
.fsbox[hidden]{display:none}
.fsbox>div{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 70px -30px rgba(91,58,176,.5);font-family:'Inter','Noto Sans SC',sans-serif}
.fsbox b{font-weight:500;color:var(--ink)}.fsbox p{margin:6px 0 12px;font-size:13px;color:var(--ink-2)}
.fsbox textarea{width:100%;height:min(52vh,460px);font:12px/1.7 'Inter','Noto Sans SC',sans-serif;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--ground);resize:vertical}
.fsbox .acts{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:13px}.fsbox .acts button{color:var(--accent)}.fsbox #fsX{margin-left:auto;color:var(--ink-2)}
.rvp .modes{padding:0 16px 4px}.rvp .tst{margin:0 0 8px;font-size:11px;color:var(--mute)}.rvp .modes button{width:100%;text-align:left;padding:9px 12px;border-radius:10px;background:var(--tint);color:var(--accent-deep);font-size:12px}
.spbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:112;width:min(640px,calc(100vw - 24px));background:rgba(253,252,255,.97);border:1px solid #CDBDF3;border-radius:16px;box-shadow:0 20px 50px -24px rgba(91,58,176,.55);padding:12px 14px;font-family:'Inter','Noto Sans SC',sans-serif}
.spbar[hidden]{display:none}
.spinfo{font-size:13px;color:var(--ink);line-height:1.5}.spinfo small{display:block;color:var(--ink-2);font-size:12px}
.spkeys{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.spkeys button{min-width:34px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--accent-deep);font-size:13px}
.spkeys button:hover{background:var(--tint)}.spkeys .sep{width:1px;height:20px;background:var(--line);margin:0 4px}.spkeys .ex{margin-left:auto;background:var(--accent);color:#fff;border-color:var(--accent)}
.sphint{margin-top:6px;font-size:11px;color:var(--mute)}
body.spmode .rvp{display:none}
.sp-sel{outline:2px solid var(--accent)!important;outline-offset:5px;border-radius:4px}
@media (hover:none){.sphint{display:none}}
.fs-hl{outline:1.5px dashed var(--accent)!important;outline-offset:4px;border-radius:4px}
.rvp summary{list-style:none;padding:10px 16px;cursor:pointer;color:var(--accent-deep);letter-spacing:.06em}
.rvp summary::-webkit-details-marker{display:none}
.rvp .in{padding:2px 16px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;width:min(430px,calc(100vw - 32px))}
.rvp .in h4{grid-column:1/-1;margin:8px 0 0;font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--ink)}
.rvp label{font-size:12px;color:var(--ink-2);white-space:nowrap}
.rvp select{font:inherit;font-size:12px;color:var(--accent-deep);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;width:100%}
.rvp .now{grid-column:1/-1;font-size:11px;line-height:1.7;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.rvp .now button{margin-left:6px;color:var(--accent)}
.rvp b{font-weight:500;color:var(--ink);font-size:11px;letter-spacing:.12em;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--tint);border-color:#CDBDF3;color:var(--accent-deep)}

/* ---------- projects: big editorial rows, hover expands ---------- */
.pj{border-top:1px solid var(--line)}
.pj-row{border-bottom:1px solid var(--line);position:relative;transition:background .6s var(--ease)}
.pj-row::before{content:"";position:absolute;inset:0 calc(var(--gut) * -1);background:var(--surface);opacity:0;transition:opacity .6s var(--ease);z-index:-1;border-radius:0}
.pj-row.open::before{opacity:1}
.pj-head{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;align-items:baseline;padding:30px 0}
.pj-head .d{font-family:var(--latin);font-size:13px;letter-spacing:.06em;color:var(--mute)}
.pj-head .t{display:flex;justify-content:space-between;align-items:baseline;gap:24px}
.pj-head h3{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(22px,2.6vw,34px);line-height:1.35;color:var(--mute);transition:color .5s var(--ease)}
.pj-head .cat{font-size:13px;color:var(--mute);white-space:nowrap}
.pj-row.open h3,.pj:not(.has-open) h3{color:var(--ink)}
.pj.has-open .pj-row:not(.open) h3{color:var(--mute)}
.pj-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .65s var(--ease)}
.pj-body>div{overflow:hidden}
.pj-in{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;padding:0 0 34px;opacity:0;transform:translateY(-8px);transition:opacity .5s .05s,transform .65s var(--ease)}
.pj-in p{margin:0 0 18px;font-size:16px;color:var(--ink-2);max-width:40em}
.pj-in .foot{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.tools{font-size:13px;color:var(--mute)}
.pj-row.open .pj-body{grid-template-rows:1fr}
.pj-row.open .pj-in{opacity:1;transform:none}
.open-btn{font-size:14px;letter-spacing:.08em;color:var(--ink);display:inline-flex;align-items:center;gap:10px}
.open-btn i{font-style:normal;color:var(--accent)}

/* ---------- toolkit + marquee ---------- */
.band{overflow:hidden;padding-block:clamp(70px,9vw,120px) 10px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.track{display:flex;width:max-content;animation:mq 55s linear infinite}
.track span{font-family:var(--serif);font-weight:400;font-size:clamp(42px,6.5vw,88px);letter-spacing:.08em;white-space:nowrap;color:#DCD1F6;padding-right:.6em}
@keyframes mq{to{transform:translateX(-50%)}}
.kit{display:grid;grid-template-columns:minmax(0,3fr) repeat(4,minmax(0,2.25fr));gap:24px}
.kit h3{font-size:13px;letter-spacing:.14em;color:var(--ink);font-weight:500;margin:0 0 12px}
.kit p{margin:0;font-size:14px;line-height:2.1;color:var(--ink-2)}

/* ---------- contact ---------- */
.contact{padding-bottom:40px}
.contact .big{max-width:18em}
.contact .big{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.2vw,60px);line-height:1.35;margin:0;color:var(--mute)}
.contact .big .k{color:var(--ink)}
.contact .row{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:38px;align-items:center}
.contact .mail{font-family:var(--latin);font-size:clamp(18px,1.8vw,22px);letter-spacing:.02em;color:var(--accent-deep)}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-block:28px 40px;margin-top:80px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.14em;color:var(--mute)}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ---------- detail view ---------- */
.detail{position:fixed;inset:0;z-index:70;background:var(--ground);overflow-y:auto;visibility:hidden}
.detail.show{visibility:visible}
.detail .bar{position:sticky;top:0;z-index:2;background:rgba(247,245,252,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.detail .bar .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:18px}
.back{display:inline-flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.08em}
.detail .head{padding-block:clamp(60px,9vw,120px) 50px}
.detail .kick{font-family:var(--latin);font-size:11px;letter-spacing:.36em;color:var(--mute);text-transform:uppercase}
.detail h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,72px);line-height:1.25;margin:18px 0 0;max-width:14em;letter-spacing:.02em;text-wrap:balance}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:48px;padding-top:26px;border-top:1px solid var(--line)}
.meta div{font-size:15px;color:var(--ink)}
.meta small{display:block;font-family:var(--latin);font-size:11px;letter-spacing:.3em;color:var(--mute);text-transform:uppercase;margin-bottom:6px}
.chap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;padding-block:48px;border-top:1px solid var(--line)}

  const cs=getComputedStyle(el),btn=el.classList.contains('btn'),pad=btn?0:52;el.dataset.lpad=pad;const l=document.createElement('span');l.className='lens';l.setAttribute('aria-hidden','true');
  l.innerHTML=el.innerHTML;l.style.cssText=`inset:-${pad}px;padding:${parseFloat(cs.paddingTop)+pad}px ${parseFloat(cs.paddingRight)+pad}px ${parseFloat(cs.paddingBottom)+pad}px ${parseFloat(cs.paddingLeft)+pad}px;display:${cs.display.includes('flex')?cs.display:'block'};align-items:${cs.alignItems};gap:${cs.gap};font:inherit;letter-spacing:inherit;justify-content:${cs.justifyContent}`;
  el.appendChild(l)}
function lensAll(){document.querySelectorAll('[data-lens]').forEach(lensify)}

  const L=T[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-k]').forEach(e=>{const v=L[e.dataset.k];if(v!=null)e.textContent=v});
  {const out=[];L.statement.forEach(([w,k],i)=>{if(w==='<br>'){out.push('<br>');return}const h=`<span class="w${k?' k':''}" style="transition-delay:${.5+i*.08}s">${w}</span>`;
    if(/^[，。、,.]$/.test(w)&&out.length&&out[out.length-1]!=='<br>')out[out.length-1]=`<span style="white-space:nowrap">${out[out.length-1]}${h}</span>`;else out.push(h)});
  $('statement').innerHTML=out.join(lang==='en'?' ':'')}

  const rows=[...el.children];let t;
  const open=r=>{rows.forEach(x=>x.classList.toggle('open',x===r));el.classList.toggle('has-open',!!r)};
  if(matchMedia('(hover:hover)').matches){

const det=$('detail'),db=$('dbody');let cur=null,busy=false,TR='slide';

function hashOf(k){return k.startsWith('cv')?'#/cv'+(k.includes(':')?'/'+k.split(':')[1]:''):'#/p/'+k.slice(1)}
function keyOf(h){let m=h.match(/^#\/p\/(\d)$/);if(m)return 'p'+m[1];m=h.match(/^#\/cv(?:\/(\w+))?$/);if(m)return 'cv'+(m[1]?':'+m[1]:'');return null}
function jump(key){const id=key.split(':')[1];if(!id)return;const el=$('cv-'+id);if(!el)return;

/* shared-element flight: a title leaves its spot and settles as the next page's header */
function ghostAt(src){const r=src.getBoundingClientRect(),cs=getComputedStyle(src),g=document.createElement('div');g.className='ghost';
  const c=src.cloneNode(true);c.querySelectorAll('.lens').forEach(x=>x.remove());
  g.innerHTML=`<h1 style="font-size:${cs.fontSize};color:${cs.color}">${c.textContent.trim()}</h1>`;
  g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.width=(innerWidth-r.left-20)+'px';document.body.appendChild(g);return g}
async function fly(g){const h=$('dh1');h.classList.add('hide-t');const r=h.getBoundingClientRect(),fs=getComputedStyle(h).fontSize;
  void g.offsetWidth;g.classList.add('go');g.style.left=r.left+'px';g.style.top=r.top+'px';
  const t=g.firstChild;t.style.transition='font-size .95s cubic-bezier(.7,0,.2,1),color .95s';t.style.fontSize=fs;t.style.color=getComputedStyle(h).color;
  await wait(980);h.classList.remove('hide-t');g.remove()}
/* page change = a tinted panel rises from the bottom, covers, then keeps rising to reveal the new page */
const wipe=$('wipe');
async function curtain(swap){wipe.style.transition='none';wipe.style.transform='translateY(100%)';wipe.style.visibility='visible';void wipe.offsetWidth;
  wipe.style.transition='transform .62s cubic-bezier(.7,0,.2,1)';wipe.style.transform='translateY(0)';await wait(640);
  swap();await wait(40);wipe.style.transform='translateY(-100%)';await wait(70);db.classList.remove('enter');await wait(600);wipe.style.visibility='hidden'}
function show(key){document.body.classList.add('lock','paged');fill(key);det.style.transition='none';det.scrollTop=0;db.classList.add('enter');det.classList.add('show');void det.offsetWidth;det.style.transition=''}
async function open(key,src,push=true){if(busy)return;busy=true;if(push)history.pushState(null,'',hashOf(key));
  document.body.classList.add('lock','paged');fill(key);det.scrollTop=0;db.classList.add('enter');await wait(180);det.classList.add('show');await wait(120);db.classList.remove('enter');await wait(700);jump(key);busy=false}
async function go(key,src,push=true){if(busy)return;if(!det.classList.contains('show'))return open(key,null,push);busy=true;
  if(push)history.pushState(null,'',hashOf(key));
  if(TR==='wipe')await curtain(()=>{fill(key);det.scrollTop=0;db.classList.add('enter')});
  else{db.classList.add('sl-out');await wait(520);fill(key);det.scrollTop=0;db.classList.remove('sl-out');db.classList.add('sl-in');void db.offsetWidth;await wait(30);db.classList.remove('sl-in');await wait(700)}
  jump(key);busy=false}

if(window.claude||/[?&]tune\b/.test(location.search))$('szp').hidden=false;
/* spacing mode: pick a kind of text, nudge it with arrow keys; applies to every element of that kind */
const BOX={name:'.who',nameEn:'.who',secT:'.sh',secEn:'.sh',btn:'.cta',nav:'.links',langb:'.lang'};
let SP={};try{SP=JSON.parse(localStorage.getItem('ax-sp2')||'{}')}catch(e){}
const spst=document.createElement('style');document.head.appendChild(spst);
const roleOf=k=>FS.find(r=>r[0]===k),boxOf=k=>BOX[k]||roleOf(k)[3];
function spCSS(){spst.textContent=Object.entries(SP).map(([k,v])=>{const r=roleOf(k);if(!r)return'';let c='';
  if(v.mt!=null&&v.mt!==v.mt0||v.dx)c+=`${boxOf(k)}{${v.mt!=null&&v.mt!==v.mt0?`margin-top:${v.mt}px!important;`:''}${v.dx?`translate:${v.dx}px 0;`:''}}`;
  if(v.lh!=null&&v.lh!==v.lh0)c+=`${r[3]}{line-height:${v.lh}!important}`;if(v.ls!=null&&v.ls!==v.ls0)c+=`${r[3]}{letter-spacing:${v.ls}em!important}`;return c}).join('\n');
  pushTune();
  try{localStorage.setItem('ax-sp2',JSON.stringify(SP))}catch(e){}}
spCSS();
let spOn=false,spK=null;
function spEls(k){return [...document.querySelectorAll(roleOf(k)[3])].filter(x=>!x.closest('.lens')&&x.getClientRects().length)}
function spState(k){if(!SP[k]){const t=spEls(k)[0],b=t&&(t.closest(boxOf(k))||t),cs=b?getComputedStyle(b):null,ct=t?getComputedStyle(t):null;
    const mt=cs?Math.round(parseFloat(cs.marginTop)):0,lh=ct?(parseFloat(ct.lineHeight)/parseFloat(ct.fontSize)||1.5):1.5;
    const ls=ct?((parseFloat(ct.letterSpacing)||0)/parseFloat(ct.fontSize)):0;
    SP[k]={mt0:mt,mt,dx:0,lh0:+lh.toFixed(2),lh:+lh.toFixed(2),ls0:+ls.toFixed(2),ls:+ls.toFixed(2)}}if(SP[k].ls==null){SP[k].ls0=0;SP[k].ls=0}return SP[k]}
function spMark(){document.querySelectorAll('.sp-sel').forEach(x=>x.classList.remove('sp-sel'));if(!spK)return;
  const bs=[...new Set(spEls(spK).map(x=>x.closest(boxOf(spK))||x))];bs.forEach(x=>x.classList.add('sp-sel'));return bs.length}
function spInfo(){if(!spK){$('spInfo').innerHTML='间距模式：点页面上任意一段文字来选中它';return}const r=roleOf(spK),v=spState(spK),n=spMark();
  $('spInfo').innerHTML=`已选中：<b>${r[1]}</b>${n>1?`（页面上共 ${n} 处，会一起变）`:''}<small>上方距离 ${v.mt}px${v.mt!==v.mt0?`（原 ${v.mt0}）`:''} · 左右偏移 ${v.dx}px · 行距 ${v.lh}${v.lh!==v.lh0?`（原 ${v.lh0}）`:''} · 字间距 ${v.ls}${v.ls!==v.ls0?`（原 ${v.ls0}）`:''}</small>`}
function spDo(a,big){if(!spK)return;const v=spState(spK),st=big?10:2;
  if(a==='up')v.mt-=st;else if(a==='down')v.mt+=st;else if(a==='left')v.dx-=st;else if(a==='right')v.dx+=st;
  else if(a==='lh+')v.lh=+(v.lh+(big?.2:.05)).toFixed(2);else if(a==='lh-')v.lh=+Math.max(.8,v.lh-(big?.2:.05)).toFixed(2);
  else if(a==='ls+')v.ls=+(v.ls+(big?.05:.01)).toFixed(2);else if(a==='ls-')v.ls=+(v.ls-(big?.05:.01)).toFixed(2);
  else if(a==='undo'){delete SP[spK]}
  spCSS();spInfo()}
function spToggle(on){spOn=on;document.body.classList.toggle('spmode',on);$('spbar').hidden=!on;if(!on){spK=null;spMark();unhl()}else{$('szp').open=false;spInfo()}}
$('spOn').onclick=()=>spToggle(true);
$('spbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a==='exit')spToggle(false);else spDo(a,e.altKey)});
function roleAt(el){for(let n=el;n&&n!==document.body;n=n.parentElement){if(n.closest('.rvp,.spbar,.fsbox'))return null;
  const r=FS.find(r=>r.length>1&&n.matches(r[3]));if(r)return r[0]}return null}
document.addEventListener('click',e=>{if(!spOn)return;if(e.target.closest('.spbar'))return;e.preventDefault();e.stopPropagation();
  const k=roleAt(e.target);if(k){spK=k;spInfo()}},true);
document.addEventListener('mouseover',e=>{if(!spOn||e.target.closest('.spbar'))return;const k=roleAt(e.target);unhl();if(!k)return;hl=spEls(k);hl.forEach(x=>x.classList.add('fs-hl'))});
addEventListener('keydown',e=>{if(!spOn)return;const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
  if(e.key==='Escape'){e.stopImmediatePropagation();spToggle(false);return}
  if(!m)return;e.preventDefault();e.stopImmediatePropagation();
  if(e.shiftKey)spDo({up:'lh+',down:'lh-',left:'ls-',right:'ls+'}[m],e.altKey);else spDo(m,e.altKey)},true);
$('fsX').onclick=()=>$('fsBox').hidden=true;
$('fsBox').addEventListener('click',e=>{if(e.target===$('fsBox'))$('fsBox').hidden=true});
$('fsDo').onclick=async()=>{const t=$('fsTxt');t.select();let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(_){}}
  $('fsOk').textContent=ok?'已复制 ✓':'浏览器不允许自动复制，请按 Ctrl+C / ⌘+C'};
if(matchMedia('(max-width:700px)').matches)$('szp').open=false;
requestAnimationFrame(()=>setTimeout(()=>$('top').classList.remove('pre'),120));

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -12% 0px'});
document.querySelectorAll('.rv,.rise').forEach(x=>io.observe(x));

/* scroll-linked */
const nav=$('nav'),pimg=$('pimg'),por=$('portrait'),rail=$('rail');
function onScroll(){const vh=innerHeight;nav.classList.toggle('solid',scrollY>vh*.6);
  const r=por.getBoundingClientRect(),p=Math.min(1,Math.max(0,(vh-r.top)/(vh*.55)));
  pimg.style.filter=`blur(${(1-p)*20}px)`;pimg.style.transform=`scale(${1.1-.1*p})`;
  const rr=rail.getBoundingClientRect();rail.style.setProperty('--p',Math.min(1,Math.max(0,(vh*.65-rr.top)/rr.height)));
  rail.querySelectorAll('.ti').forEach(t=>t.classList.toggle('on',t.getBoundingClientRect().top+34<vh*.65));
  let c=null;['about','path','work','contact'].forEach(id=>{if($(id).getBoundingClientRect().top<vh*.45)c=id});
  document.querySelectorAll('.links>a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+c))}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);onScroll();

/* cursor */
const stars={mx:-999,my:-999};
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.body.classList.add('fx-cursor');
  const c=$('cur'),ring=$('ring');let mx=-100,my=-100,rx=-100,ry=-100;
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;stars.mx=mx;stars.my=my;
    const lens=e.target.closest('[data-lens]'),link=e.target.closest('a,button');
    document.body.classList.toggle('c-lens',!!lens);document.body.classList.toggle('c-link',!!link&&!lens);
    if(lens){const b=lens.getBoundingClientRect(),pd=+lens.dataset.lpad||0,btn=pd===0;lens.style.setProperty('--lx',(mx-b.left+pd)+'px');lens.style.setProperty('--ly',(my-b.top+pd)+'px');lens.style.setProperty('--lrh',(btn?Math.max(40,b.height*.95):Math.min(46,Math.max(26,b.height*.9)))+'px')}});
  (function loop(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;c.style.transform=`translate(${mx}px,${my}px)`;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop)})();
}

/* constellation (from the original site) */
(function(){const cv=$('stars'),x=cv.getContext('2d'),hero=cv.parentElement,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,DPR=Math.min(devicePixelRatio||1,2),P=[],vis=true;
  const T0=performance.now();
  function size(){W=hero.clientWidth;H=hero.clientHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);
    const hb=hero.getBoundingClientRect(),rs=['.who','#statement','.sub','.cta'].map(q=>document.querySelector(q).getBoundingClientRect());
    const L0=Math.min(...rs.map(r=>r.left))-hb.left,T0_=Math.min(...rs.map(r=>r.top))-hb.top,R0=Math.max(...rs.map(r=>r.right))-hb.left,B0=Math.max(...rs.map(r=>r.bottom))-hb.top;
    const cx=(L0+R0)/2,cy=(T0_+B0)/2,rx=(R0-L0)/2+10,ry=(B0-T0_)/2+10;
    const n=Math.round(Math.min(130,Math.max(45,W*H/10000)));
    P=Array.from({length:n},(_,i)=>{if(i<n*.72){const a=Math.random()*Math.PI*2,pad=24+Math.random()*150,px=Math.min(W-6,Math.max(6,cx+Math.cos(a)*(rx+pad))),py=Math.min(H-6,Math.max(6,cy+Math.sin(a)*(ry+pad*.6)));
        return {x:px,y:py,hx:px,hy:py,vx:-Math.sin(a)*.18,vy:Math.cos(a)*.18,r:Math.random()*1.5+.7}}
      return {x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.5+.7}})}
  size();addEventListener('resize',size);new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(hero);
  function f(){if(vis){x.clearRect(0,0,W,H);const hb=hero.getBoundingClientRect(),mx=stars.mx-hb.left,my=stars.my-hb.top;
    const hold=Math.max(0,1-(performance.now()-T0)/9000);
    for(const p of P){if(p.hx!=null&&hold>0){p.vx+=(p.hx-p.x)*.0009*hold;p.vy+=(p.hy-p.y)*.0009*hold}const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<150&&d>0){p.vx+=dx/d*.022;p.vy+=dy/d*.022}p.vx*=.992;p.vy*=.992;
      if(Math.hypot(p.vx,p.vy)<.08){p.vx+=(Math.random()-.5)*.02;p.vy+=(Math.random()-.5)*.02}p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
    for(let i=0;i<P.length;i++){const a=P[i];for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<135){x.strokeStyle=`rgba(124,82,220,${.26*(1-d/135)})`;x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
      const dm=Math.hypot(a.x-mx,a.y-my);if(dm<170){x.strokeStyle=`rgba(124,82,220,${.3*(1-dm/170)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(mx,my);x.stroke()}
      x.fillStyle=`rgba(124,82,220,${dm<170?.8:.5})`;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}}
    if(!still)requestAnimationFrame(f)}f()})();
</script>
